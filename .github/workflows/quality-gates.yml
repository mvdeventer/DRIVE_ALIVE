name: CI

on:
  pull_request:

jobs:

  # ── Backend ──────────────────────────────────────────────────────────────────
  backend-tests:
    name: Backend — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Minimal env so pydantic-settings can boot; tests use MagicMock, no real DB.
      SECRET_KEY: ci-placeholder-secret-key-not-used-outside-ci-pipeline
      DATABASE_URL: sqlite:///./ci_test.db
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov httpx
      - name: Run tests
        run: pytest -v --tb=short --cov=app --cov-report=term-missing

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend-tests:
    name: Frontend — Jest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Jest tests
        run: npm test -- --ci --passWithNoTests

  # ── Expo web build ───────────────────────────────────────────────────────────
  expo-web-build:
    name: Frontend — Expo web export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Export Expo web build
        run: npx expo export --platform web

  # ── Quality gates (AGENTS.md) ────────────────────────────────────────────────
  i18n-completeness:
    name: i18n — locale completeness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check locale completeness
        run: npm run i18n:check-completeness

  i18n-detect-hardcoded:
    name: i18n — no hardcoded strings
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Detect hardcoded text
        run: npm run i18n:detect-hardcoded

  backend-error-code-mapping:
    name: i18n — backend error code mapping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check backend/frontend error code mapping
        run: python scripts/check_error_code_mapping.py
